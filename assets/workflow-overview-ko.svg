<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">Adaptive Agentic SDD — 워크플로 개요</title><desc id="desc">위험도별 준비 후 허용 범위 내 구현, AC별 검증, 필요한 독립 리뷰, 통합 준비 확인과 최종 Human 승인을 거칩니다. 필수 증거가 없으면 통합을 중단하며 Blind 리뷰는 선택 사항입니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5" /></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#17243a}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526278}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#526278}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#326665}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.gate{fill:#edf7f5;stroke:#81b3aa;stroke-width:1.5}.warn{fill:#fff5e6;stroke:#dca866;stroke-width:1.5}.optional{fill:#f5f3ff;stroke:#a394c5;stroke-width:1.5;stroke-dasharray:7 5}</style>
<path fill="#f5f7fa" d="M0 0H1280V1050H0Z" />
<text x="48" y="58" class="title">Adaptive Agentic SDD</text>
<text x="48" y="91" class="sub">위험도에 맞는 준비 · 증거 기반 완료 · 명시적 통합 권한</text>
<rect x="48" y="124" width="550" height="94" rx="14" class="box" />
<text x="68" y="158" class="head">01  작업 항목 + 사전 점검</text>
<text x="68" y="188" class="body">현재 AC, 위험 등급, 수정 허용·금지 범위, 실행 권한</text>
<path d="M600 171H661" class="edge" />
<rect x="674" y="124" width="558" height="94" rx="14" class="gate" />
<text x="694" y="158" class="head">02  안전에 필요한 최소 깊이 선택</text>
<text x="694" y="188" class="body">직접 증거부터 확인하고, 경계가 불명확하면 중단</text>
<text x="48" y="253" class="tag">등급별 준비 깊이</text>
<rect x="48" y="274" width="224" height="156" rx="14" class="box" />
<text x="68" y="308" class="head">Trivial</text>
<text x="68" y="338" class="body">직접 대상만 확인</text>
<text x="68" y="363" class="body">별도 SDD 문서 없음</text>
<text x="68" y="388" class="body">설계 리뷰 없음</text>
<rect x="288" y="274" width="224" height="156" rx="14" class="box" />
<text x="308" y="308" class="head">Small</text>
<text x="308" y="338" class="body">관련 범위만 확인</text>
<text x="308" y="363" class="body">작업 항목에 계획 기록</text>
<text x="308" y="388" class="body">자체 리뷰가 기본</text>
<rect x="528" y="274" width="224" height="156" rx="14" class="box" />
<text x="548" y="308" class="head">Medium</text>
<text x="548" y="338" class="body">AS-IS / PLAN 명시</text>
<text x="548" y="363" class="body">계약 위험에 따라</text>
<text x="548" y="388" class="body">필요한 리뷰 적용</text>
<rect x="768" y="274" width="224" height="156" rx="14" class="gate" />
<text x="788" y="308" class="head">Large</text>
<text x="788" y="338" class="body">AS-IS 리뷰 후</text>
<text x="788" y="363" class="body">PLAN 리뷰 진행</text>
<text x="788" y="388" class="body">각 단계 독립 판정</text>
<rect x="1008" y="274" width="224" height="156" rx="14" class="box" />
<text x="1028" y="308" class="head">Epic</text>
<text x="1028" y="338" class="body">먼저 작업 분할</text>
<text x="1028" y="363" class="body">하위 작업 등급 재판정</text>
<text x="1028" y="388" class="body">통합 책임 명시</text>
<text x="48" y="460" class="small">사람이 결정할 설계는 승인이 필요합니다. Blind 리뷰는 기본 의무가 아닌 선택 사항입니다.</text>
<path d="M640 477V489H232V508" class="edge" />
<rect x="48" y="520" width="368" height="130" rx="14" class="box" />
<text x="68" y="554" class="head">03  허용 범위 내 구현</text>
<text x="68" y="584" class="body">승인된 계약 유지</text>
<text x="68" y="609" class="body">AC를 기준으로 자체 리뷰</text>
<rect x="456" y="520" width="368" height="130" rx="14" class="box" />
<text x="476" y="554" class="head">04  검증 + 문서 동기화</text>
<text x="476" y="584" class="body">AC → 실제 결과 → 증거 연결</text>
<text x="476" y="609" class="body">대상·최종·런타임 검증</text>
<rect x="864" y="520" width="368" height="130" rx="14" class="box" />
<text x="884" y="554" class="head">05  독립 CODE 리뷰</text>
<text x="884" y="584" class="body">등급·계약 위험에 따라 수행</text>
<text x="884" y="609" class="body">작성자의 자체 리뷰와 구분</text>
<path d="M418 584H443" class="edge" />
<path d="M826 584H851" class="edge" />
<path d="M1048 652V699" class="edge" />
<rect x="864" y="716" width="368" height="132" rx="14" class="warn" />
<text x="884" y="750" class="head">06  통합 준비 확인</text>
<text x="884" y="780" class="body">필수 AC는 PASS, 필수 리뷰 충족</text>
<text x="884" y="805" class="body">증거 누락·실패가 있으면 중단</text>
<rect x="456" y="716" width="368" height="132" rx="14" class="gate" />
<text x="476" y="750" class="head">07  최종 Human 승인</text>
<text x="476" y="780" class="body">정확한 변경 버전 + 요청 작업</text>
<text x="476" y="805" class="body">설계 승인 ≠ 병합 승인</text>
<rect x="48" y="716" width="368" height="132" rx="14" class="box" />
<text x="68" y="750" class="head">08  승인 범위 내 통합</text>
<text x="68" y="780" class="body">병합·종료·정리는</text>
<text x="68" y="805" class="body">실제로 부여된 권한 안에서만</text>
<path d="M862 782H837" class="edge" />
<path d="M454 782H429" class="edge" />
<text x="48" y="900" class="tag">완료 조건을 우회하지 않기</text>
<text x="48" y="933" class="body">필수 검증이 FAIL·BLOCKED·UNVERIFIED이거나 리뷰가 빠지면 통합을 중단합니다. 승인은 증거를 대신하지 않습니다.</text>
<text x="48" y="961" class="small">작업별 최종 Human 승인 대신 위임을 적용하려면, 문서화된 저위험 정책과 적용 조건을 충족해야 합니다.</text>
<text x="48" y="1006" class="small">이해를 돕는 도식 · 정책 기준: docs/workflow.md, risk-grades.md, review-gates.md, verification.md</text>
</svg>
